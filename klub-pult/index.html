<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Klub Pult</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#e9edf1;--panel:#ffffff;--panel2:#f4f6f8;--side:#f1f6fa;--line:#cdd4db;--line2:#e2e7eb;
  --text:#1a2631;--muted:#5b6874;--accent:#0a8bb0;--accent-ink:#ffffff;--accent-soft:#d3edf5;
  --sel:#d6dbe0;--selbg:#bfe0ff;--selb:#0a66e0;--hover:#edf4f8;--ok:#1d9a52;--busy:#1f6fd0;--warn:#c98200;--off:#c0322a;
  --ok-soft:#dcf3e5;--busy-soft:#dde9fb;--warn-soft:#fbefd2;--off-soft:#f8dedb;
  --tool:#f3f4f6;--tool-b:#dde1e5;--ov:rgba(14,26,38,.4);--shadow:0 14px 44px rgba(14,30,46,.24);
  --c1:#0a8bb0;--c2:#e0891c;--c3:#7a5bd6;--c4:#2f9e6a;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1317;--panel:#151c22;--panel2:#1a2229;--side:#12191e;--line:#2b353e;--line2:#212a32;
  --text:#dbe4ea;--muted:#8e9ba6;--accent:#35b5d8;--accent-ink:#06222c;--accent-soft:#123a46;
  --sel:#27323b;--selbg:#123e6e;--selb:#4da3ff;--hover:#1b252d;--ok:#3ccb78;--busy:#62a2ff;--warn:#f0b43c;--off:#f0645a;
  --ok-soft:#133526;--busy-soft:#172a45;--warn-soft:#3a2e12;--off-soft:#3d1a18;
  --tool:#171f25;--tool-b:#29333b;--ov:rgba(0,0,0,.55);--shadow:0 14px 44px rgba(0,0,0,.5);
  --c1:#35b5d8;--c2:#f0a040;--c3:#a08bff;--c4:#4fd08f;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1317;--panel:#151c22;--panel2:#1a2229;--side:#12191e;--line:#2b353e;--line2:#212a32;
  --text:#dbe4ea;--muted:#8e9ba6;--accent:#35b5d8;--accent-ink:#06222c;--accent-soft:#123a46;
  --sel:#27323b;--selbg:#123e6e;--selb:#4da3ff;--hover:#1b252d;--ok:#3ccb78;--busy:#62a2ff;--warn:#f0b43c;--off:#f0645a;
  --ok-soft:#133526;--busy-soft:#172a45;--warn-soft:#3a2e12;--off-soft:#3d1a18;
  --tool:#171f25;--tool-b:#29333b;--ov:rgba(0,0,0,.55);--shadow:0 14px 44px rgba(0,0,0,.5);
  --c1:#35b5d8;--c2:#f0a040;--c3:#a08bff;--c4:#4fd08f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.num,.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100%}
.side{background:var(--side);border-bottom:1px solid var(--line2);display:flex;align-items:center;padding:6px 16px;gap:14px;overflow-x:auto;min-height:52px}
.brand{display:flex;flex-direction:column;flex:none;padding-right:14px;border-right:1px solid var(--line2);line-height:1.2}
.brand b{font-size:15px;letter-spacing:.02em;white-space:nowrap}
.brand span{font-size:11.5px;color:var(--muted);white-space:nowrap}
.nav{display:flex;flex-direction:row;gap:2px}
.nav button{display:flex;align-items:center;gap:7px;padding:8px 12px;border:0;border-bottom:3px solid transparent;border-radius:8px 8px 4px 4px;background:none;color:var(--muted);font-weight:500;cursor:pointer;white-space:nowrap}
.nav button:hover{background:var(--hover);color:var(--text)}
.nav button.on{background:var(--accent-soft);color:var(--text);font-weight:700;border-bottom-color:var(--accent)}
.nav button.locked{opacity:.45;cursor:not-allowed}
.nav .badge{font-size:11px;font-weight:600;color:var(--text)}
.nav .badge.red{background:var(--off);color:#fff;border-radius:99px;padding:0 6px;text-align:center}
.side-foot{margin-left:auto;display:flex;flex-direction:row;align-items:center;gap:8px;flex:none}
.me{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 5px;border:1px solid var(--line2);border-radius:99px;background:var(--panel);cursor:pointer;text-align:left;line-height:1.2;white-space:nowrap}
.me .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:12px;flex:none}
.me small{display:block;color:var(--muted);font-size:11px}
.themebtn{border:1px solid var(--line2);background:var(--panel);border-radius:99px;padding:6px 12px;cursor:pointer;color:var(--muted);font-size:12.5px;white-space:nowrap}
.main{min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column}

/* ---------- Zal ---------- */
.zal{display:flex;flex-direction:column;height:100%;min-height:0}
.toolbar{display:flex;align-items:stretch;gap:2px;padding:6px 8px;background:var(--tool);border-bottom:1px solid var(--tool-b);flex-wrap:wrap}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;min-width:70px;padding:5px 6px 4px;border:1px solid transparent;border-radius:4px;background:none;color:var(--text);font-size:12px;cursor:pointer;white-space:nowrap}
.tb:hover:not(:disabled){background:var(--panel);border-color:var(--tool-b)}
.tb:active:not(:disabled){transform:translateY(1px)}
.tb:disabled{opacity:.38;cursor:default}
.tb svg{width:30px;height:30px}
.tb.tbm{min-width:0;width:20px;padding:0;justify-content:center;font-size:12px;color:var(--muted);margin-left:-2px}
.tb.tbm:hover,.tb.tbm[aria-expanded="true"]{color:var(--text);background:var(--panel);border-color:var(--tool-b)}
.tb-sep{width:1px;background:var(--tool-b);margin:4px 6px}
.ico-scr{fill:var(--panel2);stroke:var(--muted)}
.clock{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:2px;padding:0 4px}
.crow{display:flex;align-items:center;gap:10px}
.bkb{border:1px solid var(--ok);color:var(--ok);background:var(--panel);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.bkb.off{border-color:var(--line);color:var(--muted)}.bkb.bad{border-color:var(--off);color:var(--off)}
.clock .t{color:var(--busy);font:600 22px/1 "JetBrains Mono",ui-monospace,monospace;border:1px solid var(--tool-b);background:var(--panel);padding:4px 10px;border-radius:3px;letter-spacing:.04em}
.clock .d{font-size:12px;color:var(--muted)}
.subbar{display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--panel2);border-bottom:1px solid var(--line2);flex-wrap:wrap}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tabs button{border:0;background:var(--panel);padding:4px 12px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.tabs button+button{border-left:1px solid var(--line)}
.tabs button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--text)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.chip b{font-weight:700}
.kbd-h{margin-left:auto;font-size:12px}
.subbar input{padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);min-width:0;width:200px}

.st{display:inline-block;width:11px;height:11px;flex:none;vertical-align:-1px}
.st-free{background:var(--ok);border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.st-busy{width:0;height:0;border-left:11px solid var(--busy);border-top:6px solid transparent;border-bottom:6px solid transparent}
.st-pause{border-left:4px solid var(--warn);border-right:4px solid var(--warn);width:11px}
.st-off{background:var(--off);border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}

.gridwrap{flex:1;min-height:120px;overflow:auto;background:var(--panel)}
table.pcs{border-collapse:collapse;min-width:100%;font-size:15px;font-variant-numeric:tabular-nums;user-select:none}
table.pcs th{position:sticky;top:0;z-index:1;background:var(--panel2);border:1px solid var(--line);text-align:left;font-weight:600;padding:4px 6px;white-space:nowrap;font-size:.9em;cursor:pointer}
table.pcs th .ar{font-size:10px;color:var(--muted)}
table.pcs td{border:1px solid var(--line2);padding:2px 6px;white-space:nowrap;height:1.75em}
table.pcs td.n{text-align:right;font-weight:600;width:1%}
table.pcs td.stc{width:1%;padding-right:4px}
table.pcs tr{cursor:default}
table.pcs tbody tr:hover td{background:var(--hover)}
table.pcs tbody tr.sel td{background:var(--selbg);font-weight:700;box-shadow:inset 0 2px 0 var(--selb),inset 0 -2px 0 var(--selb)}
table.pcs tbody tr.sel td:first-child{box-shadow:inset 6px 0 0 var(--selb),inset 0 2px 0 var(--selb),inset 0 -2px 0 var(--selb)}
table.pcs tbody tr.sel:hover td{background:var(--selbg)}
table.pcs td.neg{color:var(--off)}
table.pcs td.low{color:var(--off);font-weight:600}
table.pcs tr.s-off td{color:var(--muted)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;padding:12px;user-select:none;align-items:start}
.card{--stc:var(--ok);border:1px solid var(--line);border-top:4px solid var(--stc);border-radius:8px;background:var(--panel);padding:9px 10px 10px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:112px}
.card:hover{background:var(--hover)}
.card.sel{outline:3px solid var(--selb);outline-offset:2px;background:var(--selbg);box-shadow:0 0 0 7px color-mix(in srgb,var(--selb) 22%,transparent)}
.card.sel:hover{background:var(--selbg)}
.card.s-busy{--stc:var(--busy)}.card.s-pause{--stc:var(--warn)}.card.s-off{--stc:var(--off);opacity:.72}
.card .top{display:flex;justify-content:space-between;align-items:center}
.card .pn{font-size:1.45em;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.card .ct{font-size:1.6em;font-weight:700;color:var(--warn);font-variant-numeric:tabular-nums;line-height:1.1;margin-top:2px}
.card .ct.low{color:var(--off)}
.card .ct.muted{color:var(--muted);opacity:.6}
.card .cm{font-size:.9em;color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--line2)}
.card{min-width:0}
.card .kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 8px;font-size:.93em;padding-top:4px}
.card .kv span{color:var(--muted);white-space:nowrap}
.card .kv b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.card .kv b{text-align:right;font-variant-numeric:tabular-nums}
.card .blue,table.pcs td.blue{color:var(--busy)}
.ord{display:flex;flex-direction:column;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--panel)}
.ord-r{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 10px;border-bottom:1px solid var(--line2);color:var(--text);font-size:13.5px}
.ord-r:last-child{border-bottom:0}
.ord-r.dragging{opacity:.4}.ord-r.over{box-shadow:inset 0 2px 0 var(--accent)}
.ord-r .hd{cursor:grab;color:var(--muted);user-select:none;letter-spacing:-2px}
.ord-r label{display:flex;align-items:center;gap:8px;flex:1;cursor:pointer}
.ord-r .btn{padding:2px 8px}
.ord-r .btn+.btn{margin-left:2px}
.ord-fix{color:var(--muted);font-size:12.5px;padding:6px 10px;background:var(--panel2);border-bottom:1px solid var(--line2)}
.card .who{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .tm{font:500 16px/1.2 "JetBrains Mono",ui-monospace,monospace}
.card .tm.low{color:var(--off)}
.card .sm{font-size:12.5px;font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line2);border-radius:4px;overflow:hidden;margin-top:auto}
.bar i{display:block;height:100%;background:var(--stc)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.p-free{background:var(--ok-soft);color:var(--ok)}.p-busy{background:var(--busy-soft);color:var(--busy)}
.p-pause{background:var(--warn-soft);color:var(--warn)}.p-off{background:var(--off-soft);color:var(--off)}
.p-mut{background:var(--panel2);color:var(--muted);border:1px solid var(--line2)}
.p-acc{background:var(--accent-soft);color:var(--accent)}

.resize{height:7px;cursor:ns-resize;background:var(--tool);border-top:1px solid var(--line);border-bottom:1px solid var(--line2);position:relative;touch-action:none}
.resize::after{content:"";position:absolute;left:50%;top:2px;width:36px;height:2px;margin-left:-18px;border-top:1px solid var(--muted);border-bottom:1px solid var(--muted);opacity:.5}
.logp{height:220px;display:flex;flex-direction:column;background:var(--panel);min-height:80px}
.logh{display:flex;align-items:center;gap:8px;padding:4px 10px;border-bottom:1px solid var(--line2);font-size:12.5px;flex-wrap:wrap}
.logh select,.logh input{padding:2px 6px;border:1px solid var(--line);border-radius:5px;background:var(--panel2);font-size:12px}
.logh input{width:170px}
.log{flex:1;overflow:auto;font-size:12.5px;font-variant-numeric:tabular-nums}
table.lgt{border-collapse:collapse;width:100%}
table.lgt th{position:sticky;top:0;z-index:1;background:var(--panel2);border-bottom:1px solid var(--line);text-align:left;font-weight:600;font-size:11.5px;color:var(--muted);padding:4px 8px;white-space:nowrap}
table.lgt td{padding:3px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
table.lgt td.nw{white-space:nowrap;color:var(--muted)}
table.lgt td.ic{width:1%;padding-right:0}
table.lgt td.pc{white-space:nowrap;font-weight:600;text-align:right}
table.lgt tr.lg:hover td{background:var(--hover)}
table.lgt tr.lg.sel td{background:var(--accent-soft)}
table.lgt tr.lg.sel td:first-child{box-shadow:inset 3px 0 0 var(--busy)}
table.lgt .pill{font-size:11px;padding:0 7px}
.lg .li{display:block;width:15px;height:15px;margin-top:1px}
table.lgt tr.lg{cursor:default}
.lgmore{font-size:11.5px;color:var(--muted);text-align:center;padding:4px}

/* ---------- Pages ---------- */
.page{padding:20px 24px 32px;overflow:auto;height:100%;display:flex;flex-direction:column;gap:16px}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph h1{font-size:22px;margin:0 auto 0 0;text-wrap:balance}
.ph input[type=search]{padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel);width:220px;max-width:100%}
.box{background:var(--panel);border:1px solid var(--line2);border-radius:10px}
.box>h2{font-size:14px;margin:0;padding:12px 16px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px}
.box>h2 small{font-weight:400;color:var(--muted);margin-left:auto}
.boxb{padding:14px 16px}
.tbl{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.t th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;padding:9px 12px;border-bottom:1px solid var(--line2);white-space:nowrap;background:var(--panel2)}
table.t td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t td.r,table.t th.r{text-align:right;white-space:nowrap}
table.t td.act{white-space:nowrap;text-align:right}
table.t td small{display:block;color:var(--muted);font-size:12px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted);letter-spacing:.02em}
.kpi .v{font-size:19px;overflow-wrap:anywhere;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.good .v{color:var(--ok)}.kpi.bad .v{color:var(--off)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.note{font-size:12.5px;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:7px;padding:7px 12px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--text);border-color:var(--text);color:var(--bg);font-weight:700}
.btn.pri:hover,.btn.dark:hover{filter:brightness(1.25)}
.btn.dng{color:var(--off);border-color:var(--off)}
.btn.sm{padding:3px 9px;font-size:12.5px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn+.btn{margin-left:4px}

.hbar{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.hbar .tr{height:10px;background:var(--panel2);border-radius:5px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--c1);border-radius:5px}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--panel2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
svg.chart .gl{stroke:var(--line2)}

.pl td:first-child{padding-left:28px}
.pl tr.tot td{font-weight:700;background:var(--panel2)}
.pl tr.sub td{font-weight:600}

.kpi.hl{background:var(--accent-soft);border-color:var(--accent)}
.kpi.kbtn{display:flex;justify-content:space-between;align-items:center;gap:10px}
.h4m{margin:16px 0 8px;font-size:14px}
.dpl{display:flex;flex-direction:column;gap:4px;max-height:320px;overflow:auto;border:1px solid var(--line2);border-radius:10px;padding:6px}
.dpo{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--text);font:inherit}
.dpo:hover{background:var(--hover)}
.dpo.on{border-color:var(--text);background:var(--panel2)}
.dpo small{display:block;color:var(--muted);font-size:12px}
#dp-new summary{cursor:pointer;font-weight:600;font-size:13.5px}
.btn.keep{display:inline-flex;align-items:center;gap:5px}
.btn.keep.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.pmt{margin-bottom:10px}
.utabs{display:flex;gap:4px;border-bottom:1px solid var(--line2)}
.utabs button{border:0;background:none;padding:10px 18px;font:inherit;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;cursor:pointer}
.utabs button.on{color:var(--text);border-bottom-color:var(--busy)}
.barb{display:flex;flex-direction:column;gap:16px}
.bar2{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.barl{min-width:0}
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ptile{position:relative;text-align:left;border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;color:var(--text);font:inherit}
.ptile:hover:not(:disabled){border-color:var(--busy)}
.ptile:disabled{opacity:.5;cursor:not-allowed}
.ptile .pp{color:var(--busy);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.ptile small{color:var(--muted)}.ptile small.lowq{color:var(--off)}

<script>
(function(){
'use strict';
/* =================== Konstantalar =================== */
const LS='klubpult_v1', LS_UI='klubpult_ui_v1';
const DAY=864e5, MIN=6e4, PCS=50;
const METHODS={cash:'Naqd',card:'Karta',click:'Click',payme:'Payme'};
const MODES={pre:'Oldindan toʻlov',post:'Keyin toʻlov',balance:'Balansdan'};
const STATUS={free:'Boʻsh',busy:'Band',pause:'Pauza',off:'Oʻchiq'};
const MON=['yan','fev','mar','apr','may','iyn','iyl','avg','sen','okt','noy','dek'];
const MONL=['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];
const WD=['Ya','Du','Se','Ch','Pa','Ju','Sh'];
const EXP_CATS=['Ijara','Elektr energiya','Internet','Ish haqi','Taʼmirlash','Boshqa'];
const DEF_LEVELS=[{n:'Bronze',min:0,b:0},{n:'Silver',min:500000,b:3},{n:'Gold',min:2000000,b:5},{n:'Platinum',min:5000000,b:7}];
const PERMS=[['kassa','Kassa summasini koʻrish','Smena va hisobotdagi «Kassada boʻlishi kerak» summasi','Kassa summasi'],
  ['chiqim','Chiqim kiritish','Bar › Chiqim kiritish','Chiqim'],['chegirma','Qarz toʻlovida chegirma berish','','Chegirma'],
  ['hisobot','Hisobotni koʻrish','','Hisobot'],['foyda','Foyda hisob-kitobini koʻrish','Tushum, xarajat va sof foyda','Foyda'],
  ['sozlamalar','Sozlamalarni ochish','Kompyuterlar, qulf ekrani, interfeys. Foydalanuvchilar, backup va tozalash baribir admin uchun','Sozlamalar'],
  ['tarifEdit','Tariflarni qoʻshish va oʻzgartirish','','Tariflar'],['prodEdit','Bar mahsulotini qoʻshish va tahrirlash','','Mahsulot'],
  ['prodDelete','Bar mahsulotini oʻchirish','','Mahsulot oʻchirish'],['debtDelete','Qarz yozuvlarini tahrirlash va oʻchirish','','Qarz tahriri'],
  ['pcPower','Kompyuterlarni oʻchirish, yoqish, qayta yuklash','','Quvvat'],['procs','Jarayonlarni tugatish va tozalash','','Jarayonlar']];
const DEF_PERMS={kassa:true,chiqim:true,chegirma:true,hisobot:true,foyda:false,sozlamalar:false,tarifEdit:false,prodEdit:true,prodDelete:false,debtDelete:false,pcPower:true,procs:true};
const DEF_GAMES=[{id:'gm1',name:'Counter-Strike 2',cat:'Shooter',path:'C:\\Games\\CS2\\cs2.exe',color:'#e8a33d'},{id:'gm2',name:'Dota 2',cat:'MOBA',path:'C:\\Games\\Dota 2\\dota2.exe',color:'#c23c2a'},
  {id:'gm3',name:'PUBG: Battlegrounds',cat:'Battle royale',path:'C:\\Games\\PUBG\\TslGame.exe',color:'#d9a441'},{id:'gm4',name:'Valorant',cat:'Shooter',path:'C:\\Riot Games\\VALORANT\\VALORANT.exe',color:'#ff4655'},
  {id:'gm5',name:'EA SPORTS FC 25',cat:'Sport',path:'C:\\Games\\FC25\\FC25.exe',color:'#1fc27a'},{id:'gm6',name:'GTA V',cat:'Action',path:'C:\\Games\\GTAV\\PlayGTAV.exe',color:'#5aa0e6'},
  {id:'gm7',name:'Fortnite',cat:'Battle royale',path:'C:\\Games\\Fortnite\\FortniteLauncher.exe',color:'#8a5cf6'},{id:'gm8',name:'Discord',cat:'Dasturlar',path:'C:\\Apps\\Discord\\Update.exe',color:'#5865f2'},
  {id:'gm9',name:'Steam',cat:'Dasturlar',path:'C:\\Program Files (x86)\\Steam\\steam.exe',color:'#3d6a8a'}];
const ZCOLS=[['grp','Guruh','',true],['tarif','Tarif','',true],['bal','Balans','',true],['start','Boshlanish','start',true],['end','Tugash','',true],['vaqt','Vaqt','',true],
  ['left','Qoldi','left',true],['bar','Bar','',true],['sum','Summa','sum',true],['played','Oʻynagan pul','played',true],['client','Mijoz','',true],['app','Ilova','',true],['mode','Toʻlov turi','',true],['note','Izoh','',true],['ip','IP','',false]];
const CROWS=[['open','Ochildi',true],['end','Tugaydi',true],['sum','Hisob',true],['vaqt','Oʻynadi',true],['played','Oʻynagan pul',true],
  ['left','Qoldi',false],['client','Mijoz',false],['tarif','Tarif',false],['bar','Bar',false],['grp','Guruh',false],['app','Ilova',true]];
const CMODE={pre:'Oldindan toʻlangan',post:'Keyin toʻlov',balance:'Balansdan'};
const hhmm=ms=>{ms=Math.max(0,ms);const m=Math.floor(ms/MIN);return p2(Math.floor(m/60))+':'+p2(m%60)};
function played(s,now){const c=timeCost(s,now);return s.mode==='pre'?Math.min(s.paid,c):c}
function ordered(list,order,vis){const by=Object.fromEntries(list.map(x=>[x[0],x]));return order.map(k=>by[k]).filter(x=>x&&vis[x[0]])}
const IP_RE=/^(25[0-5]|2[0-4]\d|1?\d?\d)(\.(25[0-5]|2[0-4]\d|1?\d?\d)){3}$/;
const normMac=x=>{const h=String(x).replace(/[^0-9a-f]/gi,'');return h.length===12?h.toUpperCase().match(/../g).join('-'):''};
const macFor=n=>[0x74,0x56,0x3C,0x85,(n*37)&255,(n*91+17)&255].map(x=>x.toString(16).toUpperCase().padStart(2,'0')).join('-');
const rangeTxt=a=>{a=[...a].sort((x,y)=>x-y);const r=[];for(let i=0;i<a.length;i++){let j=i;while(j+1<a.length&&a[j+1]===a[j]+1)j++;r.push(j>i?a[i]+'–'+a[j]:String(a[i]));i=j}return r.join(', ')};

/* =================== Yordamchilar =================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const r100=n=>Math.round(n/100)*100;
const num=n=>(n<0?'−':'')+Math.abs(Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const som=n=>num(n)+' soʻm';
const p2=n=>String(n).padStart(2,'0');
const hms=t=>{const d=new Date(t);return p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())};
const hm=t=>{const d=new Date(t);return p2(d.getHours())+':'+p2(d.getMinutes())};
const dstr=t=>{const d=new Date(t);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()};
const dshort=t=>{const d=new Date(t);return d.getDate()+' '+MON[d.getMonth()]};
const dur=ms=>{ms=Math.max(0,ms);const m=Math.floor(ms/MIN);return Math.floor(m/60)+':'+p2(m%60)};
const durS=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000);return Math.floor(s/3600)+':'+p2(Math.floor(s/60)%60)+':'+p2(s%60)};
const durTxt=m=>{m=Math.round(m);const h=Math.floor(m/60),mm=m%60;return (h?h+' soat ':'')+(mm||!h?mm+' daqiqa':'')};
const sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const ymKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+p2(d.getMonth()+1)};
const compact=n=>n>=1e6?(n/1e6).toFixed(n>=1e7?0:1).replace('.',',')+' mln':n>=1e3?Math.round(n/1e3)+' ming':String(Math.round(n));
const v=id=>{const e=document.getElementById(id);return e?e.value:''};
const vn=id=>Math.max(0,Math.round(Number(String(v(id)).replace(/\s/g,''))||0));
function rng(seed){return ()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296}}

/* =================== Holat (state) =================== */
let S=null;
const ui={view:'zal',zalMode:'table',sel:new Set(),last:null,lc:null,stf:'all',pcq:'',sort:{k:'n',d:1},
  logLimit:150,logF:'all',logQ:'',logSel:null,logH:220,cq:'',dq:'',dAll:false,rp:null,pm:null};
try{const u=JSON.parse(localStorage.getItem(LS_UI)||'{}');if(u.zalMode)ui.zalMode=u.zalMode;if(u.logH)ui.logH=u.logH;if(Array.isArray(u.procCols))ui.procCols=u.procCols;}catch(e){}
function saveUI(){try{localStorage.setItem(LS_UI,JSON.stringify({zalMode:ui.zalMode,logH:ui.logH,procCols:ui.procCols}))}catch(e){}}
function save(){const j=JSON.stringify(S);try{localStorage.setItem(LS,j)}catch(e){}try{if(window.kpDb)window.kpDb.save(j)}catch(e){}if(typeof bkSchedule==='function')bkSchedule()}
function load(){try{const j=(window.kpInitState!=null)?window.kpInitState:localStorage.getItem(LS);if(j){const s=JSON.parse(j);if(s&&s.v===1)return s}}catch(e){}return null}

const client=id=>S.clients.find(c=>c.id===id);
const prod=id=>S.products.find(p=>p.id===id);
const tariff=id=>S.tariffs.find(t=>t.id===id);
const me=()=>S.users.find(u=>u.login===S.user)||S.users[0];
const pcBy=n=>S.pcs.find(p=>p.n===n);
const levels=()=>S.settings.levels;
const grpName=id=>{const g=S.groups.find(x=>x.id===id);return g?g.name:'—'};
const grpAllows=(gid,t)=>{const g=S.groups.find(x=>x.id===gid);return !g||!g.tariffs.length||g.tariffs.includes(t.id)};
const isAdmin=()=>me().role==='admin';
const elevated=()=>(ui.elev||0)>Date.now();
const adminish=()=>isAdmin()||elevated();
const can=k=>adminish()||!!((me().perms||{})[k]);
const who=s=>s.clientId&&client(s.clientId)?client(s.clientId).name:(s.guest||'Mehmon');
const active=p=>p.status==='busy'||p.status==='pause';
const curShift=()=>S.shifts.find(s=>!s.closeAt);

/* =================== Seans hisob-kitobi =================== */
function elapsed(s,now=Date.now()){return Math.max(0,now-s.start-s.pausedTotal-(s.pausedAt?now-s.pausedAt:0))}
function limitMs(s){
  if(s.mode==='pre')return s.paidMin*MIN;
  if(s.mode==='balance'){const c=client(s.clientId);return c?Math.floor(c.balance/s.rate*60)*MIN:0}
  return null;
}
const barTotal=s=>s.bar.reduce((a,b)=>a+b.price*b.qty,0);
function timeCost(s,now){return r100(s.rate*Math.ceil(elapsed(s,now)/MIN)/60)}
function accrued(s,now){return (s.mode==='pre'?s.paid:timeCost(s,now))+barTotal(s)}
function creditLeft(s,now){
  if(s.mode==='pre')return s.paid-timeCost(s,now)-barTotal(s);
  if(s.mode==='balance'){const c=client(s.clientId);return (c?c.balance:0)-timeCost(s,now)-barTotal(s)}
  return -(timeCost(s,now)+barTotal(s));
}
function endAt(s,now=Date.now()){const L=limitMs(s);return L==null?null:s.start+s.pausedTotal+(s.pausedAt?now-s.pausedAt:0)+L}
function applies(t,date=new Date()){
  if(!t.active||!(t.price>0))return false;
  if(t.days&&t.days.length&&!t.days.includes(date.getDay()))return false;
  if(t.from&&t.to){
    const c=date.getHours()*60+date.getMinutes();
    const [fh,fm]=t.from.split(':').map(Number),[th,tm]=t.to.split(':').map(Number);
    const f=fh*60+fm,e=th*60+tm;
    return f<=e?(c>=f&&c<e):(c>=f||c<e);
  }
  return true;
}
function led(kind,amount,method,extra){if(amount>0)S.ledger.push(Object.assign({id:uid(),t:Date.now(),kind,amount,method},extra||{}))}
function addLog(type,text,t,x){const e={t:t||Date.now(),type,text};if(x){if(x.in>0)e.in=x.in;if(x.out>0)e.out=x.out;if(x.m)e.m=x.m}S.log.push(e);if(S.log.length>3000)S.log.splice(0,S.log.length-3000);if(ui.view==='zal')renderLog('append')}

function startSession(n,o){
  const pc=pcBy(n),t=tariff(o.tariffId),now=Date.now();
  if(pc.status==='off'){addLog('info',`Wake-on-LAN paketi yuborildi → PC ${n} (MAC ${pc.mac}) — vaqt ochildi`);if(NET&&pc.mac)NET.wol(pc.mac)}
  pc.offAt=null;
  const rate=t.type==='hour'?t.price:Math.round(t.price/(t.minutes/60));
  const s={id:uid(),start:now,mode:o.mode,tariffId:t.id,tname:t.name,rate,clientId:o.clientId||null,guest:o.guest||'',
    pausedTotal:0,pausedAt:null,bar:[],note:o.note||'',paid:0,paidMin:0};
  if(o.mode==='pre'){
    s.payMethod=o.method||'cash';
    s.paidMin=t.type==='package'?t.minutes:o.minutes;
    s.paid=t.type==='package'?t.price:o.amount;
    led('pc',s.paid,o.method,{pc:n,clientId:s.clientId});
  }
  pc.status='busy';pc.session=s;
  const L=limitMs(s);
  addLog('info',`Seans boshlandi PC ${n} >> (${dstr(now)} ${hms(now)}${L!=null?' – '+hms(now+L):''}) ${MODES[s.mode]} / ${t.name} / ${who(s)}`+
    (o.mode==='pre'?` / Toʻlandi ${som(s.paid)} (${METHODS[o.method]})`:'')+(o.mode==='balance'?` / Balans ${som(client(s.clientId).balance)}`:''),0,o.mode==='pre'?{in:s.paid,m:o.method}:null);
}
function finishSession(n,method,auto,debtTo){
  const pc=pcBy(n),s=pc.session,now=Date.now();
  const mins=Math.max(1,Math.ceil(elapsed(s,now)/MIN));
  let pcCost=s.mode==='pre'?s.paid:r100(s.rate*mins/60);
  const bt=barTotal(s);
  // qaytarish: oldindan toʻlangan, ishlatilmagan vaqt puli (manfiy yozuv — hisobot va kassadan avtomatik ayriladi)
  // oldindan toʻlangan, ishlatilmagan vaqt puli mijozga avtomatik qaytariladi (manfiy yozuv — hisobot va kassadan ayriladi)
  const refund={method:s.payMethod||'cash'};let back=0;if(!auto&&s.mode==='pre'){back=Math.max(0,s.paid-timeCost(s,now));if(back>0){S.ledger.push({id:uid(),t:now,kind:'pc',amount:-back,method:refund.method,pc:n,clientId:s.clientId,refund:true});pcCost-=back}}
  if(s.mode==='balance'){
    const c=client(s.clientId);const take=Math.min(pcCost,c?c.balance:0);
    if(c)c.balance-=take;pcCost=take;led('pc',take,'balance',{pc:n,clientId:s.clientId});
  }
  const due=(s.mode==='post'?pcCost:0)+bt;
  const m=due>0?method:'none';
  if(s.mode==='post')led('pc',pcCost,m,{pc:n,clientId:s.clientId});
  s.bar.forEach(b=>led('bar',b.price*b.qty,m,{pid:b.pid,qty:b.qty,cost:b.cost*b.qty,pc:n,clientId:s.clientId}));
  let part=0;
  if(m==='debt'){const dd={id:uid(),clientId:debtTo?debtTo.clientId:s.clientId,name:debtTo?debtTo.name:who(s),phone:debtTo&&debtTo.phone||'',amount:due,t:now,note:`Seans: PC ${n}`+(auto?' (vaqt tugadi, avtomatik)':'')};S.debts.push(dd);
    if(debtTo&&debtTo.payNow>0){part=Math.min(debtTo.payNow,due);const lid=uid();S.ledger.push({id:lid,t:now,kind:'debtpay',amount:part,method:debtTo.payMethod,clientId:dd.clientId});
      S.debtPays.push({id:uid(),key:debtKey(dd),clientId:dd.clientId,name:dd.name,t:now,amount:part,disc:0,pct:0,method:debtTo.payMethod,ledgerId:lid,note:'Seans yakunida qisman'})}}
  S.history.push({id:uid(),pc:n,clientId:s.clientId,start:s.start,end:now,minutes:mins,pcCost,barCost:bt,total:pcCost+bt,method:m,mode:s.mode});
  pc.status=pc.pwrOff?'off':'free';pc.session=null;pc.pwrOff=false;
  const tail=due>0?(m==='debt'?(part?`Hozir toʻlandi ${som(part)} (${METHODS[debtTo.payMethod]}), qarzga yozildi ${som(due-part)}`:`Qarz daftariga yozildi ${som(due)}`)+`${debtTo&&debtTo.name!==who(s)?' → '+debtTo.name:''}`:`Mijozdan olindi ${som(due)} (${METHODS[m]})`):(back?'':'Qoʻshimcha toʻlov yoʻq');
  const ret=back?`${tail?' / ':''}Mijozga qaytarildi ${som(back)} (${METHODS[refund.method]})`:'';
  addLog(due>0||back?'warn':'info',`Seans yakunlandi PC ${n} >> ${dstr(now)} ${hms(now)} / ${s.tname} / ${who(s)} / ${som(pcCost+bt)} / ${durTxt(mins)} / ${tail}${ret}`+(auto?' / avtomatik':''),0,{in:due>0&&m!=='debt'?due:0,out:back,m:due>0&&m!=='debt'?m:back?refund.method:''});
}

  st.debtDisc=Object.assign({on:true,pct:25},st.debtDisc||{});

/* =================== Statistika =================== */
const INFLOW=m=>m in METHODS;
function shiftStats(from,to){
  const r={m:{cash:0,card:0,click:0,payme:0},pc:0,bar:0,topup:0,debtpay:0,debt:0,total:0,sessions:0,outCash:0,outOther:0};
  for(const e of S.expenses)if(e.src==='kassa'&&e.t>=from&&e.t<to){if(e.method==='cash')r.outCash+=e.amount;else r.outOther+=e.amount}
  for(const e of S.ledger){if(e.t<from||e.t>=to)continue;
    if(INFLOW(e.method)){r.m[e.method]+=e.amount;r.total+=e.amount}
    if(e.kind==='pc')r.pc+=e.amount;else if(e.kind==='bar')r.bar+=e.amount;else if(e.kind==='topup')r.topup+=e.amount;else if(e.kind==='debtpay')r.debtpay+=e.amount;
    if(e.method==='debt')r.debt+=e.amount;}
  for(const h of S.history)if(h.end>=from&&h.end<to)r.sessions++;
  return r;
}
function spentMap(){const m={};for(const h of S.history)if(h.clientId)m[h.clientId]=(m[h.clientId]||0)+h.total;return m}
function levelOf(sp){const L=levels();let l=L[0];for(const x of L)if(sp>=x.min)l=x;return l}

function toast(msg,kind){const t=document.createElement('div');t.className='toast'+(kind==='err'?' err':'');t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),kind==='err'?4200:2600)}
const modals=[];
function modal({title,body,wide,xl,actions,onMount,locked}){
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="dlg${xl?' xl':wide?' wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dlg-h"><h3>${esc(title)}</h3>${xl?'<button class="mx" type="button" data-mx aria-label="Butun ekranga" title="Butun ekranga">⤢</button>':''}${locked?'':'<button class="x" type="button" data-x aria-label="Yopish">×</button>'}</div><div class="dlg-b">${body}</div><div class="dlg-f"></div></div>`;
  const f=$('.dlg-f',ov);
  let escFn;const close=()=>{ov.remove();const i=modals.indexOf(escFn);if(i>=0)modals.splice(i,1)};escFn=locked?()=>{}:close;
  (actions||[{label:'Yopish'}]).forEach(a=>{const b=document.createElement('button');b.type='button';b.className='btn '+(a.cls||'');b.textContent=a.label;if(a.id)b.id=a.id;if(a.disabled){b.disabled=true;if(a.title)b.title=a.title}

function procList(p){

  const sid=p.status==='off'?'off':p.session?p.session.id:'idle';let st=procs[p.n];
  if(!st||st.sid!==sid){const list=[];
    if(sid!=='off'){PSYS.forEach(x=>list.push({name:x[0],exe:x[1],mem:x[2],cpu:x[3],sys:true}));
      if(p.session){const h=hashS(sid),g=PGAMES[h%PGAMES.length];list.unshift({name:g[0],exe:g[1],mem:g[2],cpu:g[3],game:true});

document.addEventListener('keydown',e=>{

    const k=(e.key==='ArrowDown'||e.key==='ArrowUp')?gridCols():1;return moveSel(arrows[e.key]*k,e.shiftKey,e.ctrlKey||e.metaKey)}

function renderLog(mode){

  const list=filteredLog(),shown=list.slice(-ui.logLimit),more=list.length-shown.length;

/* =================== HISOBOT =================== */
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function stackChart(rows,colors,fmtY){
  const W=1000,H=250,pl=62,pr=8,pt=12,pb=26,iw=W-pl-pr,ih=H-pt-pb;
  const max=niceMax(Math.max(1,...rows.map(r=>r.vals.reduce((a,b)=>a+b,0))));
  const bw=iw/rows.length,step=Math.ceil(rows.length/12);
  let g='';for(let i=0;i<=4;i++){const y=pt+ih-ih*i/4;g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-8}" y="${y+4}" text-anchor="end">${fmtY(max*i/4)}</text>`}
  rows.forEach((r,i)=>{let y=pt+ih;const x=pl+i*bw+bw*.16,w=bw*.68;
    r.vals.forEach((v,j)=>{const h=v/max*ih;if(h>0){y-=h;g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${colors[j]}" rx="1.5"><title>${esc(r.label)}: ${r.vals.map(som).join(' + ')}</title></rect>`}});
    if(i%step===0)g+=`<text x="${(pl+i*bw+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(r.label)}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tushum grafigi">${g}</svg>`;
}
/* ---------- Qarzdorlar (bir kishining barcha qarz va toʻlovlari bitta hisobda) ---------- */
const debtKey=d=>d.clientId?'c:'+d.clientId:'n:'+String(d.name||'').trim().toLowerCase();
const dmy=t=>{const d=new Date(t);return p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.'+d.getFullYear()+' '+hm(t)};
function debtors(){
  const m={};
  const get=(key,src)=>m[key]||(m[key]={key,clientId:src.clientId||null,name:src.name,phone:src.phone||'',debt:0,paid:0,left:0,last:0,n:0});
  S.debts.forEach(d=>{const x=get(debtKey(d),d);x.debt+=d.amount;x.n++;if(d.t>=x.last){x.last=d.t;x.le={k:'qarz',a:d.amount}}if(d.phone&&!x.phone)x.phone=d.phone});
  S.debtPays.forEach(p=>{const x=get(p.key,p);x.paid+=p.amount+(p.disc||0);if(p.t>=x.last){x.last=p.t;x.le={k:'toʻlov',a:p.amount+(p.disc||0)}}});
  Object.values(m).forEach(x=>{const c=x.clientId&&client(x.clientId);if(c){x.name=c.name;x.phone=c.phone;x.login=c.login}x.left=x.debt-x.paid});
  return m;
}
function openDebtorCount(){return Object.values(debtors()).filter(x=>x.left>0).length}

/* ---------- Faylni saqlash: claude.ai havolasida «downloads», oddiy faylda odatiy yuklab olish ---------- */
async function saveFile(fname,data,mime){
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){dl=null}
  if(dl){try{await dl.save({filename:fname,data});return 'saved'}catch(e){if(e&&e.code==='declined')return 'declined';throw e}}
  const blob=data instanceof Blob?data:new Blob([data],{type:mime||'application/octet-stream'});

  else if(pre==='month'){const d=new Date(t0);d.setDate(1);f=d.getTime();t=t0+DAY-MIN}
  else{f=t0;t=t0+DAY-MIN}
  return {pre,f,t}}

    else{const days=Math.min(93,Math.ceil(span/DAY));for(let i=0;i<days;i++){const a=sod(F)+i*DAY;bucket(a,a+DAY,days>10?String(new Date(a).getDate()):WD[new Date(a).getDay()]+' '+new Date(a).getDate())}}}

function setPcs(b){
  ui.pcTab=ui.pcTab||'pcs';
  const T=[['pcs',`Kompyuterlar (${S.pcs.length})`],['grp',`Guruhlar (${S.groups.length})`],['srv','Server ulanishi'],['beh','Xatti-harakat']];

  $$('[data-pt]',b).forEach(x=>x.onclick=()=>{ui.pcTab=x.dataset.pt;setPcs(b)});
}
function pcsGroups(b,tabs){

    ${S.groups.map(g=>{const c=S.pcs.filter(p=>p.group===g.id);return `<tr><td><span class="gsw" style="background:${esc(g.color||'#0a8bb0')}"></span><b>${esc(g.name)}</b></td>

    <div class="note">Kompyuterni guruhga «Kompyuterlar» yorligʻidagi jadvaldan biriktirasiz. Guruhga tarif biriktirilsa, Start oynasida shu guruh kompyuterlari uchun faqat oʻsha tariflar chiqadi. Hech qaysi tarif belgilanmasa — hammasi ruxsat.</div>`;

    confirmM('Guruhni oʻchirish',`«${esc(g.name)}» guruhi oʻchirilsinmi?`,()=>{S.groups=S.groups.filter(y=>y!==g);commit()},'Oʻchirish')});
}
function pcsTable(b,tabs){

    ${S.pcs.map(p=>`<tr><td><input type="checkbox" data-pk="${p.n}"${ui.pcChk.has(p.n)?' checked':''} aria-label="PC ${p.n}"></td><td><b>${p.n}</b>${p.paired?'':'<small>juftlanmagan</small>'}</td>

    <div class="btnrow"><button class="btn pri" type="button" id="pc-add">Qoʻshish</button><button class="btn dng" type="button" id="pc-del">Belgilanganlarni oʻchirish</button><button class="btn" type="button" id="pc-grp">Guruhga oʻtkazish</button><button class="btn" type="button" id="pc-wol">Belgilanganlarni yoqish (WOL)</button><span class="note" style="margin-left:auto" id="pc-cnt"></span></div></div>
    <div class="note">IP manzil qoʻlda kiritiladi. MAC manzil kompyuterdagi klient dasturi serverga ulanganda avtomatik aniqlanadi; aniqlanmasa — qoʻlda kiriting (masalan <span class="mono">74-56-3C-85-2C-A2</span>). «Yoqish» tugmasi — Zalda ham, shu yerda ham — shu MAC manzilga Wake-on-LAN paketi yuboradi. Oʻzgarishlar maydondan chiqqanda saqlanadi.</div>`;
  const cnt=()=>{$('#pc-cnt').textContent=ui.pcChk.size?`${ui.pcChk.size} ta belgilangan`:''};cnt();
  const picked=()=>S.pcs.filter(p=>ui.pcChk.has(p.n));
  const again=()=>setPcs(b);
  $$('[data-pk]',b).forEach(x=>x.onchange=()=>{const n=+x.dataset.pk;x.checked?ui.pcChk.add(n):ui.pcChk.delete(n);cnt()});
  $('#pk-all').onchange=e=>{ui.pcChk=e.target.checked?new Set(S.pcs.map(p=>p.n)):new Set();again()};
  $$('[data-f]',b).forEach(x=>x.onchange=()=>{
    const p=pcBy(+x.dataset.n),f=x.dataset.f;let val=x.value.trim();
    if(f==='ip'&&val&&!IP_RE.test(val)){x.classList.add('bad');return toast('IP manzil notoʻgʻri. Masalan: 192.168.1.201','err')}

  $$('[data-wol]',b).forEach(x=>x.onclick=()=>{wake([pcBy(+x.dataset.wol)]);again()});

  $('#pc-add').onclick=pcAddModal;
  $('#pc-grp').onclick=()=>{const l=picked();if(!l.length)return toast('Avval kompyuterlarni belgilang','err');
    modal({title:`${l.length} ta kompyuterni guruhga oʻtkazish`,body:`<div class="frm"><label>Guruh<select id="pg-g">${gopts('')}</select></label></div>`,
      actions:[{label:'Bekor qilish'},{label:'Oʻtkazish',cls:'pri',run:()=>{l.forEach(p=>p.group=v('pg-g'));commit();toast('Guruh oʻzgartirildi')}}]})};
  $('#pc-del').onclick=()=>{const l=picked();if(!l.length)return toast('Oʻchirish uchun kompyuterlarni belgilang','err');
    const busy=l.filter(active);if(busy.length)return toast(`${busy.map(p=>'PC '+p.n).join(', ')} da seans ochiq — avval yakunlang`,'err');
    if(l.length>=S.pcs.length)return toast('Kamida bitta kompyuter qolishi kerak','err');
    confirmM('Kompyuterlarni oʻchirish',`PC ${rangeTxt(l.map(p=>p.n))} roʻyxatdan oʻchirilsinmi? Ular Zalda koʻrinmay qoladi, eski hisobotlar saqlanadi.`,()=>{
      S.pcs=S.pcs.filter(p=>!ui.pcChk.has(p.n));l.forEach(p=>ui.sel.delete(p.n));ui.pcChk=new Set();
      addLog('info',`Kompyuter oʻchirildi: PC ${rangeTxt(l.map(p=>p.n))}`);commit();toast(`${l.length} ta kompyuter oʻchirildi`)},'Oʻchirish')};
}

/* ---------- Chegirmalar: qarz toʻlovida ---------- */
function discCalc(given,pct,left){let a=given,ded=Math.round(given*(1+pct/100));if(ded>left){ded=left;a=Math.ceil(left/(1+pct/100))}return {a,ded,disc:ded-a}}
function setDisc(b){
  const d=S.settings.debtDisc;
  b.innerHTML=`<div class="box"><h2>Qarz toʻlovida chegirma</h2><div class="boxb"><div class="frm" style="max-width:520px">
    <label class="ck">${sw('dd-on',d.on,'Chegirma yoqilgan')}Qarz toʻlanayotganda chegirma qoʻllansin</label>
    <label>Chegirma foizi (%)<input id="dd-p" type="number" min="0" max="100" step="1" value="${d.pct}"></label>
    <div class="flabel">Misol</div><div class="sumbox" id="dd-ex"></div>
    <div><button class="btn pri" type="button" id="dd-s">Saqlash</button></div></div></div></div>
    <div class="note">Mijoz qarzini toʻlayotganda bergan summasiga shu foiz qoʻshilib, qarzidan ayriladi. Foizni toʻlov oynasida har safar oʻzgartirish yoki oʻchirish mumkin. Berilgan chegirmalar Foyda hisob-kitobida alohida qatorda koʻrinadi.</div>`;
  const ex=()=>{const on=$('#dd-on').checked,p=on?Math.max(0,Math.min(100,+v('dd-p')||0)):0,r=discCalc(100000,p,200000);
    $('#dd-ex').innerHTML=`<div class="ln"><span>Qarz</span><span>${som(200000)}</span></div><div class="ln"><span>Mijoz berdi</span><span>${som(r.a)}</span></div><div class="ln"><span>Chegirma ${p}%</span><span>+${som(r.disc)}</span></div><div class="ln big"><span>Qarzdan ayriladi</span><span>${som(r.ded)}</span></div><div class="ln muted"><span>Qolgan qarz</span><span>${som(200000-r.ded)}</span></div>`};
  b.addEventListener('input',ex);b.addEventListener('change',ex);ex();
  $('#dd-s').onclick=()=>{d.on=$('#dd-on').checked;d.pct=Math.max(0,Math.min(100,+v('dd-p')||0));save();toast('Chegirma saqlandi')};
}

function ordEditor(box,list,order,vis,fixTxt){
  const lab=Object.fromEntries(list.map(x=>[x[0],x[1]]));let drag=null;
  const draw=()=>{box.innerHTML=`<div class="ord-fix">${fixTxt}</div>`+order.map((k,i)=>`<div class="ord-r" draggable="true" data-k="${k}"><span class="hd" aria-hidden="true">⋮⋮</span>
    <label><input type="checkbox" data-v="${k}"${vis[k]?' checked':''}>${lab[k]}</label>
    <button class="btn sm" type="button" data-m="-1" data-k="${k}"${i===0?' disabled':''} aria-label="${lab[k]} — yuqoriga">↑</button><button class="btn sm" type="button" data-m="1" data-k="${k}"${i===order.length-1?' disabled':''} aria-label="${lab[k]} — pastga">↓</button></div>`).join('');
    $$('[data-v]',box).forEach(x=>x.onchange=()=>{vis[x.dataset.v]=x.checked;save()});
    $$('[data-m]',box).forEach(x=>x.onclick=()=>{const i=order.indexOf(x.dataset.k),j=i+ +x.dataset.m;if(j<0||j>=order.length)return;[order[i],order[j]]=[order[j],order[i]];save();draw();const f=$(`[data-m="${x.dataset.m}"][data-k="${x.dataset.k}"]`,box);if(f&&!f.disabled)f.focus()});
    $$('.ord-r',box).forEach(r=>{
      r.ondragstart=e=>{drag=r.dataset.k;r.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',drag)}catch(err){}};
      r.ondragend=()=>{drag=null;$$('.ord-r',box).forEach(x=>x.classList.remove('dragging','over'))};
      r.ondragover=e=>{if(!drag)return;e.preventDefault();$$('.ord-r',box).forEach(x=>x.classList.toggle('over',x===r))};
      r.ondrop=e=>{e.preventDefault();if(!drag||drag===r.dataset.k)return;const from=order.indexOf(drag);order.splice(from,1);order.splice(order.indexOf(r.dataset.k),0,drag);save();draw()};
    });
  };draw();
}

    <p class="note" style="margin-top:0">Sinovdan keyin yoki yangi davr boshlanganda keraksiz yozuvlarni boʻlimlab tozalang. Sozlamalar, kompyuterlar, tariflar, mahsulotlar va operatorlar oʻchmaydi. Tozalashdan oldin <b>Backup</b> boʻlimida nusxa olib qoʻyish tavsiya etiladi.</p>

function cleanRun(keys,b){
  const items=CLEAN.filter(c=>keys.includes(c.k)&&c.n());if(!items.length)return;
  const danger=items.some(c=>c.danger);
  modal({title:'Maʼlumotlarni tozalash',body:`<div class="frm"><div class="sumbox">${items.map(c=>`<div class="ln"><span${c.danger?' style="color:var(--off);font-weight:600"':''}>${c.t}</span><span>${num(c.n())} ta</span></div>`).join('')}</div>
    <p class="note" style="margin:0">Tozalashdan oldin joriy maʼlumotlar arxiv nusxaga saqlanadi${bk.dir?' va papkaga alohida «…-eski.json» fayl boʻlib yoziladi':''}. Asosiy backup fayl yangi maʼlumotlar bilan davom etadi. Orqaga qaytish: Sozlamalar › Backup › Arxiv nusxalar.</p>
    ${danger?`<label class="ck" style="color:var(--off)"><input type="checkbox" id="cl-ok">${items.filter(c=>c.danger).map(c=>c.t.toLowerCase()).join(' va ')} ham oʻchishini tushunaman</label>`:''}<div class="err" id="cl-e"></div></div>`,
    actions:[{label:'Bekor qilish'},{label:'Tozalash',cls:'pri dngf',run:()=>{

/* ---------- Arxiv nusxalar ---------- */
const idb={db:null,open(){return this.db?Promise.resolve(this.db):new Promise((ok,no)=>{const r=indexedDB.open('klubpult',1);r.onupgradeneeded=()=>r.result.createObjectStore('arch',{keyPath:'id'});r.onsuccess=()=>{this.db=r.result;ok(this.db)};r.onerror=()=>no(r.error)})},
  tx(mode,fn){return this.open().then(db=>new Promise((ok,no)=>{const t=db.transaction('arch',mode),q=fn(t.objectStore('arch'));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)}))}};
async function archiveNow(reason,json){
  json=json||JSON.stringify(S);const a={id:'a'+Date.now().toString(36)+uid().slice(0,3),t:Date.now(),reason,user:me().name,size:json.length,data:json},where=[];
  if(bk.dir){try{const d=new Date(a.t),fn=bkName().replace('.json',`-${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}-${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}-eski.json`);
    const fh=await bk.dir.getFileHandle(fn,{create:true}),w=await fh.createWritable();await w.write(json);await w.close();a.file=fn;where.push('papkada '+fn)}catch(e){}}
  try{await idb.tx('readwrite',st=>st.put(a));where.push('arxiv nusxalar roʻyxatida')}catch(e){}
  return where;
}
async function archList(){try{return ((await idb.tx('readonly',st=>st.getAll()))||[]).sort((x,y)=>y.t-x.t)}catch(e){return null}}
const kb=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
async function archBox(b){const el=$('#ar-l',b);if(!el)return;const l=await archList();
  if(l===null){el.innerHTML='<div class="empty">Bu brauzerda arxiv saqlab boʻlmaydi (IndexedDB oʻchiq). Papka tanlangan boʻlsa, eski nusxalar papkaga yoziladi.</div>';return}
  el.innerHTML=l.length?`<table class="t"><thead><tr><th>Sana</th><th>Sabab</th><th>Kim</th><th class="r">Hajmi</th><th></th></tr></thead><tbody>${l.map(a=>`<tr><td>${dmy(a.t)}</td><td>${esc(a.reason)}${a.file?`<small>papkada: ${esc(a.file)}</small>`:''}</td><td>${esc(a.user||'—')}</td><td class="r">${kb(a.size)}</td>
    <td class="act"><button class="btn sm pri" type="button" data-ar="${a.id}">Tiklash</button><button class="btn sm" type="button" data-ad="${a.id}">Yuklab olish</button><button class="btn sm dng" type="button" data-ax="${a.id}" aria-label="Oʻchirish">×</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Hali arxiv nusxa yoʻq. Maʼlumotlarni tozalashdan oldin avtomatik olinadi.</div>';
  const get=id=>l.find(a=>a.id===id);
  $$('[data-ar]',el).forEach(x=>x.onclick=()=>{const a=get(x.dataset.ar);let o;try{o=JSON.parse(a.data)}catch(e){return toast('Arxiv buzilgan','err')}
    confirmM('Arxivdan tiklash',`${dmy(a.t)} holatiga qaytariladi (${esc(a.reason)}). Hozirgi maʼlumotlar ham avval arxivga saqlanadi — kerak boʻlsa yana qaytish mumkin.`,()=>{
      const cur=JSON.stringify(S);S=o;migrate();if(!S.users.some(u=>u.login===S.user))S.user=S.users[0].login;applyTheme();save();ui.sel.clear();
      addLog('warn',`Maʼlumotlar arxivdan tiklandi: ${dmy(a.t)} (${a.reason}) — ${me().name}`);commit();
      archiveNow('Arxivdan tiklashdan oldin',cur).then(()=>{archBox(b)});toast('Arxivdan tiklandi')},'Tiklash')});
  $$('[data-ad]',el).forEach(x=>x.onclick=async()=>{const a=get(x.dataset.ad),d=new Date(a.t);try{await saveFile(bkName().replace('.json',`-${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}-${p2(d.getHours())}${p2(d.getMinutes())}-arxiv.json`),a.data,'application/json')}catch(e){toast('Saqlab boʻlmadi','err')}});
  $$('[data-ax]',el).forEach(x=>x.onclick=()=>confirmM('Arxiv nusxani oʻchirish',`${dmy(get(x.dataset.ax).t)} nusxasi oʻchirilsinmi?`,async()=>{try{await idb.tx('readwrite',st=>st.delete(x.dataset.ax))}catch(e){}archBox(b)},'Oʻchirish'));
}

/* =================== TARMOQ: haqiqiy DUST2 klient agentlari ===================
   Klub Pult Server (admin/) window.kpNet orqali LAN'da WebSocket server ochadi
   (ws://<ip>:<port>/agent). Klient agentlar shared/protocol.md dagi protokol bilan
   ulanadi: konvert {v,type,id,ts,payload}. Brauzerda kpNet yoʻq — ichki simulyatsiya. */
const NET=window.kpNet||null;
const net={conn:{},byPc:{},info:null,procs:{},lockSig:{},sess:{},prev:{},boot:{},fsw:{},queue:{},svc:{for:null,hash:''}};
const LIVE_ONLY=new Set(['power.off','power.reboot','process.list','process.kill','time.sync','session.start','session.add_time','session.pause','session.resume','session.end','session.lock','lock.config','theme.set']);
const online=p=>!!(NET&&p&&net.byPc[p.n]!=null);
const canWake=p=>NET?(!online(p)&&!!p.mac):(p.status==='off'||p.pwrOff);
const DMODE={pre:'pre',post:'open',balance:'acc'};
function netInit(){if(!NET)return;NET.on(netEv);netStart();
  setInterval(()=>NET.info().then(i=>{net.info=i}),5000)}
function netStart(){return NET.start(S.settings.srv.port).then(i=>{net.info=i;
  if(i.err){addLog('warn',`Server ishga tushmadi: ${i.err}`);toast('Server ishga tushmadi: '+i.err,'err')}
  else{const sv=S.settings.srv;if(i.ips.length&&!i.ips.some(x=>x.ip===sv.ip)){sv.ip=i.ips[0].ip;save()}
    addLog('info',`Server ishga tushdi: ${i.ips.map(x=>x.ip).join(', ')||'—'} · port ${i.port} · yoʻl /agent`)}
  if(ui.view==='sozlamalar')render()})}
/* ---- konvert va yordamchilar ---- */
const uuidv=()=>crypto.randomUUID?crypto.randomUUID():[...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,'0')).join('');
function env(type,payload){return {v:1,type,id:uuidv(),ts:Date.now(),payload:payload||{}}}
function netSend(n,type,payload){const e=env(type,payload),id=net.byPc[n];
  if(id!=null){NET.send(id,e);return e.id}
  if(LIVE_ONLY.has(type))return null;
  const q=net.queue[n]||(net.queue[n]=[]);q.push({at:Date.now(),msg:e});while(q.length>100)q.shift();return e.id}
function flushQueue(n){const q=net.queue[n];if(!q||!q.length)return;delete net.queue[n];const now=Date.now(),id=net.byPc[n];if(id==null)return;
  let fresh=0,stale=0;for(const x of q){if(now-x.at<=60000){NET.send(id,x.msg);fresh++}else stale++}
  if(fresh)addLog('info',`PC ${n}: navbatdagi ${fresh} ta buyruq yuborildi`);
  if(stale)addLog('info',`PC ${n}: ${stale} ta eskirgan buyruq tashlandi`)}
async function netResyncAll(){if(!NET)return;for(const p of S.pcs){if(!online(p))continue;const now=Date.now(),sp=dSession(p,now);
  sendRaw(net.byPc[p.n],'sync',{serverTime:now,session:sp,lock:dLock(p),behaviour:dBeh(),agent:await dAgent()});net.sess[p.n]=sessCur(p,sp);net.lockSig[p.n]=JSON.stringify(dLock(p))}}
function netMaybeWake(p){if(NET&&p&&!online(p)&&p.mac&&S.settings.beh.autoWake)wake([p])}
function sendRaw(id,type,payload){NET.send(id,env(type,payload))}
async function sha256hex(str){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const b64=u8=>btoa(String.fromCharCode(...new Uint8Array(u8)));
async function svcHash(){const pw=S.settings.srv.svcPass||'';if(net.svc.for===pw)return net.svc.hash;
  if(!pw){net.svc.for=pw;net.svc.hash='';return ''}
  const it=120000,salt=crypto.getRandomValues(new Uint8Array(16));
  const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},key,256);
  net.svc.for=pw;net.svc.hash=`pbkdf2$${it}$${b64(salt)}$${b64(bits)}`;return net.svc.hash}
const wphash=d=>{if(!d)return null;let h=5381;for(let i=0;i<d.length;i+=37)h=((h<<5)+h+d.charCodeAt(i))>>>0;return 'w'+d.length.toString(36)+h.toString(36)};
const sidNum=x=>{let h=2166136261;for(const c of String(x)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
function pcByName(name){const q=String(name||'').trim().toLowerCase();
  return S.pcs.find(p=>(p.cname&&p.cname.toLowerCase()===q)||('pc '+p.n)===q||('pc '+p2(p.n))===q||('pc'+p.n)===q||String(p.n)===q)}
/* ---- DUST2 payloadlar ---- */
function dSession(p,now){const s=p.session;if(!s)return null;const lim=limitMs(s),rem=lim==null?null:Math.max(0,Math.round(lim-elapsed(s,now)));
  return {sessionId:sidNum(s.id),mode:DMODE[s.mode]||'pre',startedAt:s.start,endsAt:rem==null?null:now+rem,remainingMs:rem,rate:s.rate,
    client:s.clientId?who(s):null,paused:p.status==='pause',due:barTotal(s)+(s.mode==='post'?timeCost(s,now):0)}}
function dLock(p){const L=Object.assign({},LK_DEF,lockFor(p));
  return {theme:L.theme,layout:L.h,valign:L.v,clockSize:L.sClock,titleSize:L.sTitle,textSize:L.sSub,title:L.title||S.settings.name,text:L.sub||'',
    clock:L.showClock!==false,pcName:!!L.showPc,login:L.showLogin!==false,fit:L.fit,dim:L.dim,wallpaperHash:L.bg?wphash(L.bg):null}}
function dBeh(){const b=S.settings.beh,w=S.settings.warn;
  return {onExpire:b.end==='lockoff'?'delay':(b.end||'lock'),offDelay:b.offMin||5,blockInput:b.block!==false,
    warnMin:(w&&w.on&&w.mins&&w.mins.length)?Math.max.apply(null,w.mins):5,showWidget:b.timer!==false}}
async function dAgent(){return {servicePassHash:await svcHash(),unlockCombo:S.settings.srv.hotkey||'Ctrl+Alt+P'}}
const sessCur=(p,sp)=>sp?{id:sp.sessionId,mode:sp.mode,paused:sp.paused,paidMin:(p.session&&p.session.paidMin)||0,due:Math.round(sp.due/1000)}:null;
/* ---- ulanish hodisalari ---- */
function netRefresh(){save();renderNav();if(ui.view==='zal'){renderGrid();updateToolbar()}}
function attach(id,p,ip,mac,ver){const old=net.byPc[p.n];if(old!=null&&old!==id)NET.close(old);
  net.conn[id].pc=p.n;net.conn[id].ver=ver||'';net.byPc[p.n]=id;
  delete net.lockSig[p.n];delete net.sess[p.n];net.prev[p.n]='on';net.boot[p.n]=p.bootUntil||0;
  p.paired=true;if(ip&&!p.ip)p.ip=String(ip);if(mac)p.mac=String(mac).toUpperCase().replace(/-/g,':');
  if(p.pwrOff)p.pwrOff=false;if(p.status==='off')p.status=p.session?'busy':'free';p.bootUntil=0;flushQueue(p.n)}
function fastStartupWarn(p,on){if(!on||net.fsw[p.n])return;net.fsw[p.n]=1;
  addLog('warn',`PC ${p.n}: tez ishga tushirish (fast startup) yoqilgan — oʻchirilgach masofadan yoqish ishlamasligi mumkin`)}
function netEv(ev){
  if(ev.type==='server'){net.info=ev.info;if(ev.info.err)toast('Server: '+ev.info.err,'err');return}
  if(ev.type==='open'){net.conn[ev.id]={ip:ev.ip,pc:null,at:Date.now()};return}
  if(ev.type==='close'){const c=net.conn[ev.id];delete net.conn[ev.id];
    if(c&&c.pc!=null&&net.byPc[c.pc]===ev.id){const p=pcBy(c.pc);delete net.byPc[c.pc];delete net.sess[c.pc];delete net.lockSig[c.pc];net.prev[c.pc]='off';
      if(p){if(p.status==='free'){p.status='off';addLog('info',`PC ${p.n}: agent uzildi — oʻchiq deb belgilandi`)}
        else if(active(p))addLog('warn',`PC ${p.n}: agent bilan aloqa uzildi — seans davom etmoqda, vaqt kompyuterda sanaladi`)}
      netRefresh()}return}
  if(ev.type==='msg')Promise.resolve(netMsg(ev.id,ev.msg)).catch(e=>console.error(e));
}
async function netMsg(id,m){const c=net.conn[id];if(!c)return;
  if(!m||m.v!==1||typeof m.type!=='string'||!m.type||typeof m.id!=='string'||!m.id){sendRaw(id,'error',{code:'bad_request',message:'Xabar formati notoʻgʻri'});return}
  const P=m.payload&&typeof m.payload==='object'?m.payload:{};
  if(c.pc==null){
    if(m.type==='pair.request')return pairReq(id,m,P);
    if(m.type==='hello')return helloReq(id,m,P);
    return sendRaw(id,'error',{re:m.id,code:'unauthorized',message:'Avval juftlanish kerak'})}
  const p=pcBy(c.pc);if(!p)return;const s=p.session,ok=()=>sendRaw(id,'ack',{re:m.id});
  switch(m.type){
    case 'heartbeat':return ok();
    case 'time.request':return sendRaw(id,'time.sync',{serverTime:Date.now()});
    case 'time.synced':{const d=Math.round(+(P.driftMs||0));if(Math.abs(d)>=1000)addLog('info',`PC ${p.n}: kompyuter soati toʻgʻrilandi (${Math.round(d/1000)} soniya farq)`);return ok()}
    case 'client.request_time':S.requests.push({id:uid(),t:Date.now(),pc:p.n,clientId:s&&s.clientId,name:s?who(s):('PC '+p.n),text:'Vaqt soʻrash'});addLog('warn',`PC ${p.n}: mijoz vaqt soʻramoqda${s?' ('+who(s)+')':''}`);toast(`PC ${p.n}: mijoz vaqt soʻramoqda`);netRefresh();return ok();
    case 'client.call_admin':S.requests.push({id:uid(),t:Date.now(),pc:p.n,clientId:s&&s.clientId,name:s?who(s):('PC '+p.n),text:'Administratorni chaqirdi'});addLog('warn',`PC ${p.n}: administrator chaqirilmoqda`);toast(`PC ${p.n}: administrator chaqirilmoqda`);netRefresh();return ok();
    case 'client.warning_shown':addLog('info',`PC ${p.n}: klientga ogohlantirish koʻrsatildi (${Math.round(+(P.minutes||0))} daqiqa qoldi)`);return ok();
    case 'session.started':case 'session.updated':return ok();
    case 'session.ended':{const r=String(P.reason||'');if(r==='logout'&&s&&s.mode==='balance'&&barTotal(s)===0){finishSession(p.n,'none');addLog('info',`PC ${p.n}: mijoz akkauntdan chiqdi`);commit()}return ok()}
    case 'message.shown':{(p.inbox||[]).forEach(x=>{if(!x.seen&&x.mid===P.re)x.seen=true});save();return ok()}
    case 'lock.wallpaper.request':{const d=(Object.assign({},LK_DEF,lockFor(p)).bg)||'',mm=/^data:([^;]+);base64,(.*)$/.exec(d);
      return sendRaw(id,'lock.wallpaper',{hash:d?wphash(d):null,mime:mm?mm[1]:'',dataBase64:mm?mm[2]:''})}
    case 'process.list.result':net.procs[p.n]={t:Date.now(),cpu:+(P.cpu||0),ramUsed:+(P.ramUsedMb||0),ramTotal:+(P.ramTotalMb||0),
      list:(Array.isArray(P.items)?P.items:[]).slice(0,250).map(x=>({name:String(x.name||x.exe||'?'),exe:String(x.exe||''),pid:+x.pid||0,mem:+(x.ramMb||0),cpu:+(x.cpu||0),sys:x.kind==='sys',game:x.kind==='shell',prot:!!x.protected}))};return ok();
    case 'client.unpair':p.token='';p.paired=false;addLog('warn',`PC ${p.n}: klient oʻzini uzdi`);ok();
      setTimeout(()=>{const cid=net.byPc[p.n];if(cid!=null){delete net.byPc[p.n];NET.close(cid)}netRefresh()},50);return;
    case 'auth.login':return authLogin(id,p,P);
    default:return sendRaw(id,'error',{re:m.id,code:'bad_request',message:'Nomaʼlum xabar: '+m.type})}
}
async function pairReq(id,m,P){const sv=S.settings.srv,name=String(P.name||'').trim(),code=String(P.code||'');
  const deny=(reason,msg)=>{sendRaw(id,'pair.denied',{reason,message:msg});addLog('warn',`Juftlash rad etildi (${reason}): "${name}"`)};
  if(code!==sv.code)return deny('bad_code','Ulanish kodi notoʻgʻri. Admin kompyuterda koʻrsatilgan kodni kiriting.');
  const p=pcByName(name);
  if(!p)return deny('unknown_pc',`Bu nom bilan kompyuter roʻyxatda yoʻq: "${name}". Avval Sozlamalar › Kompyuterlar boʻlimida shu nomli kompyuter qoʻshing.`);
  if(net.byPc[p.n]!=null){const oc=net.byPc[p.n];delete net.byPc[p.n];NET.close(oc)}
  const tok=[...crypto.getRandomValues(new Uint8Array(32))].map(x=>x.toString(16).padStart(2,'0')).join('');
  p.token=await sha256hex(tok);p.cname=name;
  attach(id,p,P.ip,P.mac,P.version);
  sendRaw(id,'pair.ok',{token:tok,pcId:p.n,name,serverTime:Date.now()});
  fastStartupWarn(p,P.fastStartup);addLog('info',`Klient juftlandi: PC ${p.n} (${name})${P.ip?' — '+P.ip:''}`);
  const now=Date.now(),sp=dSession(p,now);
  sendRaw(id,'sync',{serverTime:now,session:sp,lock:dLock(p),behaviour:dBeh(),agent:await dAgent()});
  net.sess[p.n]=sessCur(p,sp);net.lockSig[p.n]=JSON.stringify(dLock(p));netRefresh()}
async function helloReq(id,m,P){const hash=await sha256hex(String(P.token||''));
  const p=S.pcs.find(x=>x.token&&x.token===hash);
  if(!p){sendRaw(id,'error',{re:m.id,code:'unauthorized',message:'Maxfiy kalit yaroqsiz — qayta juftlang'});setTimeout(()=>NET.close(id),100);return}
  attach(id,p,P.ip,P.mac,P.version);
  const now=Date.now(),sp=dSession(p,now),name=p.cname||('PC '+p.n);
  sendRaw(id,'hello.ok',{pcId:p.n,name,serverTime:now,session:sp,lock:dLock(p),behaviour:dBeh(),agent:await dAgent()});
  net.sess[p.n]=sessCur(p,sp);net.lockSig[p.n]=JSON.stringify(dLock(p));
  fastStartupWarn(p,P.fastStartup);addLog('info',`PC ${p.n}: agent ulandi (${P.version||'?'})`);netRefresh()}
async function authLogin(id,p,P){const deny=(reason,msg)=>sendRaw(id,'auth.denied',{reason,message:msg});
  const r=klLogin(p,String(P.login||''),String(P.password||''));
  if(r.err){const reason=/band|oʻynayapti/.test(r.err)?'busy':/[Bb]alans/.test(r.err)?'low_balance':'bad_credentials';return deny(reason,r.err)}
  addLog('info',`PC ${p.n}: mijoz qulf ekranidan akkaunt bilan kirdi (${r.name})`);
  const now=Date.now(),sp=dSession(p,now);
  sendRaw(id,'auth.ok',{login:String(P.login||'').trim().toLowerCase(),balance:r.balance,remainingMs:sp?sp.remainingMs||0:0,rate:sp?sp.rate:0});
  sendRaw(id,'session.start',sp);net.sess[p.n]=sessCur(p,sp);netRefresh()}
/* ---- har soniyada: quvvat, qulf, seans oʻzgarishlari, xabarlar ---- */
function netTick(){if(!NET)return;const now=Date.now();
  S.pcs.forEach(p=>{
    if(!online(p)){net.prev[p.n]=(p.status==='off'||p.pwrOff)?'off':'on';return}
    const v=(p.status==='off'||p.pwrOff)?'off':'on';
    if(net.prev[p.n]==='on'&&v==='off'){netSend(p.n,'power.off',{mode:'now'});addLog('info',`PC ${p.n}: oʻchirish buyrugʻi yuborildi`)}
    net.prev[p.n]=v;
    if(p.bootUntil&&net.boot[p.n]!==p.bootUntil&&p.bootUntil>now){net.boot[p.n]=p.bootUntil;netSend(p.n,'power.reboot')}
    const lk=JSON.stringify(dLock(p));if(net.lockSig[p.n]!==lk){net.lockSig[p.n]=lk;netSend(p.n,'lock.config',dLock(p))}
    const sp=dSession(p,now),cur=sessCur(p,sp),prev=net.sess[p.n]||null;
    if(sp&&!prev)netSend(p.n,'session.start',sp);
    else if(!sp&&prev)netSend(p.n,'session.lock',{due:(p.lastEnd&&now-p.lastEnd.t<3*MIN)?p.lastEnd.due:0});
    else if(sp&&prev){
      if(cur.paused&&!prev.paused)netSend(p.n,'session.pause',{sessionId:sp.sessionId});
      else if(!cur.paused&&prev.paused)netSend(p.n,'session.resume',{sessionId:sp.sessionId,endsAt:sp.endsAt,remainingMs:sp.remainingMs});
      else if(cur.paidMin!==prev.paidMin||cur.mode!==prev.mode||cur.due!==prev.due)netSend(p.n,'session.start',sp);
    }
    net.sess[p.n]=cur;
    const un=(p.inbox||[]).find(x=>!x.seen&&!x.sent);
    if(un){un.mid=netSend(p.n,'message',{text:un.text});un.sent=true}
  })}
/* haqiqiy ilovada birinchi ishga tushishda namuna maʼlumotlar emas, toza klub */
function realStart(){seed();migrate();CLEAN.forEach(c=>c.run());
  S.clients=[];S.products=[];S.log=[];S.requests=[];S.stockLog=[];S.shifts=S.shifts.filter(x=>!x.closeAt);S.shifts.forEach(x=>{x.openCash=0;x.openAt=Date.now();x.user='admin'});
  S.pcs.forEach(p=>Object.assign(p,{status:'off',session:null,ip:'',mac:'',paired:false,token:'',cname:'',inbox:[],pwrOff:false,offAt:null,lastEnd:null}));
  S.user='admin';addLog('info','Klub Pult Server birinchi marta ishga tushdi — toza baza')}
/* =================== Ishga tushirish =================== */
S=load()||(NET?(realStart(),S):seed());
if(!S.pcs||!S.pcs.length)seed();
migrate();
applyTheme();
{const f=S.pcs.find(active);if(f){ui.sel.add(f.n);ui.last=f.n}}

$('#nav2').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b)go(b.dataset.v)});

save();renderNav();render();
if(S.users.some(u=>u.active!==false&&u.pass))loginModal(true);
netInit();

setInterval(()=>{
  const now=Date.now();let ch=false;
  const w=S.settings.warn;
  S.pcs.forEach(p=>{const s=p.session;if(!s||p.status!=='busy')return;const L=limitMs(s);if(L==null)return;
    const left=L-elapsed(s,now);
    if(left<=0){finishSession(p.n,barTotal(s)>0?'debt':'none',true);p.lastEnd={t:now,due:barTotal(s)};ch=true;const be=S.settings.beh;
      if(be.end==='off'){p.status='off';addLog('info',`PC ${p.n}: vaqt tugadi — kompyuter oʻchirildi`)}
      else if(be.end==='lockoff'){p.offAt=now+be.offMin*MIN;addLog('info',`PC ${p.n}: vaqt tugadi — qulflandi, ${be.offMin} daqiqadan soʻng oʻchadi`)}
      return}
    if(w.on){s.warned=s.warned||[];w.mins.forEach(mm=>{if(left<=mm*MIN&&L>mm*MIN&&!s.warned.includes(mm)){s.warned.push(mm);const t=w.text.replace(/\{min\}/g,mm);
      pushInbox(p,t,'Avtomatik');addLog('msg',`Avtomatik ogohlantirish → PC ${p.n}: "${t}"`);ch=true}})}});
  S.pcs.forEach(p=>{if(p.offAt&&now>=p.offAt){if(p.status==='free'){p.status='off';addLog('info',`PC ${p.n}: yangi vaqt ochilmadi — kompyuter oʻchirildi`);ch=true}p.offAt=null}});
  $$('[data-lkclk]').forEach(e=>{const x=hm(now);if(e.textContent!==x)e.textContent=x});
  {const sc=$('#srv-clk');if(sc)sc.textContent=hms(now)}
  if(ch){save();renderNav();if(ui.view!=='zal'&&!(ui.view==='sozlamalar'&&document.activeElement&&document.activeElement.closest('.set-body')))render()}
  if(ui.view==='zal'){updateClock();renderGrid();updateToolbar()}
  updateShell();
  netTick();
},1000);
})();
